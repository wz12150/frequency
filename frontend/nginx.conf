

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;

    keepalive_timeout  65;


    # 80 端口配置 - 访问根目录 index.html
    server {
        listen      0.0.0.0:80;
        server_name  www.cdwztech.com localhost;

        # 前端静态资源 (SPA)
        location / {
            root   html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存配置
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root   html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API 转发到后端 8080
        location ^~ /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # 81 端口配置 - 访问 dist 目录
    server {
        listen     0.0.0.0:81;
        server_name  www.cdwztech.com localhost;

        # 核心修改：将根目录直接指向 dist 文件夹
        # 这样通过 IP:81 即可直接访问 dist 里的内容
        location / {
            root   html/dist;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 81 端口的静态资源缓存 (注意 root 指向)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root   html/dist;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API 转发同样需要配置
        location ^~ /api/ {
            proxy_pass         http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # 84端口配置 - 访问 freq 目录
    server {
        listen     0.0.0.0:84;
        server_name  www.cdwztech.com localhost;

        # 核心修改：将根目录直接指向 freq 文件夹
        # 这样通过 IP:84 即可直接访问 freq 里的内容
        location / {
            root   html/freq;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 84端口的静态资源缓存 (注意 root 指向)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root   html/freq;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API 转发同样需要配置
        location ^~ /api/ {
            proxy_pass         http://127.0.0.1:8084;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

}
